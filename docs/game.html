<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f9fff">
<title>单词消消乐 · 英语学习小助手</title>
<style>
:root{
  --blue1:#5aa9ff; --blue2:#4f9fff;
  --warm1:#ffca7a; --warm2:#ffa62b;
  --primary:#6c63ff;
  --ink:#2b3a55; --muted:#8a93a8;
  --panel:#ffffff; --line:#e3edfb;
  --ok:#2fc48d; --bad:#ff7a8a;
  --shadow:0 8px 22px rgba(79,159,255,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--ink);background:#f0f4ff;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* ---------- 顶栏（与主程序一致） ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,#4f9fff,#6c63ff);
  color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;
  box-shadow:0 2px 10px rgba(79,159,255,.28);
}
.topbar h1{flex:1;margin:0;font-size:17px;font-weight:700;letter-spacing:.3px}
.topbar button{
  width:38px;height:38px;flex:0 0 auto;border:none;cursor:pointer;
  border-radius:12px;background:rgba(255,255,255,.18);color:#fff;
  font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease,background .15s ease;
}
.topbar button:active{transform:scale(.92)}
.container{max-width:560px;margin:0 auto;padding:14px 14px 36px}

.crumb{
  font-size:12.5px;color:var(--muted);margin:2px 2px 12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.view{display:none;animation:fadeUp .26s ease both}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px 2px;line-height:1.6}

/* ---------- 年级卡片 ---------- */
.grade-grid{display:grid;grid-template-columns:1fr;gap:12px}
.grade-card{
  border:1.5px solid #dfe7ff;cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  background:#fff;border-radius:16px;padding:16px 18px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
  transition:transform .16s ease,border-color .16s ease;
}
.grade-card:hover{transform:translateY(-2px);border-color:#bcd3ff}
.grade-card:active{transform:scale(.985)}
.grade-card .emoji{font-size:28px}
.grade-card .gname{font-size:16px;font-weight:800}
.grade-card .gmeta{font-size:12px;color:var(--muted);margin-top:3px}
.grade-card .arrow{margin-left:auto;color:#a9b6d4;font-size:18px}

/* ---------- 上下册 tab ---------- */
.sem-tabs{display:flex;gap:8px;margin-bottom:12px;background:#e8eeff;padding:5px;border-radius:14px}
.sem-tabs button{
  flex:1;border:none;cursor:pointer;padding:10px 0;border-radius:11px;
  font-size:14.5px;font-weight:700;color:#7788a8;background:transparent;
  transition:all .2s ease;font-family:inherit;
}
.sem-tabs button.on{background:#fff;color:var(--primary);box-shadow:0 4px 12px rgba(108,99,255,.16)}

/* ---------- 单元卡片 ---------- */
.unit-grid{display:grid;grid-template-columns:1fr;gap:11px}
.unit-card{
  position:relative;border:1.5px solid #e3eaff;cursor:pointer;text-align:left;
  background:#fff;border-radius:15px;padding:14px 16px;font-family:inherit;color:inherit;
  box-shadow:0 4px 14px rgba(79,159,255,.08);
  display:flex;flex-direction:column;gap:5px;
  transition:transform .16s ease,border-color .16s ease;
}
.unit-card:hover{transform:translateY(-2px);border-color:#c8d8ff}
.unit-card:active{transform:scale(.99)}
.unit-card .ukey{font-size:11.5px;font-weight:700;color:#7f96d8;letter-spacing:.3px}
.unit-card .utitle{font-size:15.5px;font-weight:800;line-height:1.35;padding-right:70px}
.unit-card .umeta{font-size:12px;color:var(--muted)}
.unit-card .badge{
  position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;
  color:#0f9c72;background:#e3fbf2;border-radius:20px;padding:3px 9px;
}
.unit-card .badge.doing{color:#c07a00;background:#fff3df}

/* ---------- 游戏 HUD ---------- */
.game-hud{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
  background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);
}
.game-hud .stat{font-size:12.5px;color:var(--muted);white-space:nowrap}
.game-hud .stat b{color:var(--ink);font-size:14.5px;margin-left:2px}
.bar{flex:1;height:9px;border-radius:99px;background:#e9f1fd;overflow:hidden;min-width:44px}
.bar > i{
  display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#7cc4ff,#4f9fff);
  transition:width .35s cubic-bezier(.34,1.4,.64,1);
}
.reset-btn{
  border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;
  color:var(--primary);background:#eeecff;border-radius:11px;padding:8px 12px;
  transition:transform .15s ease;
}
.reset-btn:active{transform:scale(.94)}

.unit-line{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-size:12px;color:var(--muted)}
.unit-line .track{flex:1;height:5px;border-radius:99px;background:#e4eafc;overflow:hidden}
.unit-line .track > i{
  display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#ffca7a,#ffa62b);transition:width .35s ease;
}

/* ---------- 棋盘 / 明牌卡片 ---------- */
.board{display:grid;gap:9px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.card{
  position:relative;aspect-ratio:4/3;cursor:pointer;border-radius:14px;
  animation:cardIn .3s ease var(--d,0s) both;
  transition:transform .16s cubic-bezier(.34,1.4,.64,1),box-shadow .16s ease;
}
@keyframes cardIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.card .face{
  position:absolute;inset:0;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5px;text-align:center;overflow:hidden;
  font-weight:800;color:#fff;box-shadow:0 5px 12px rgba(88,140,214,.16);
}
.card .face.en{background:linear-gradient(160deg,var(--blue1),var(--blue2))}
.card .face.cn{background:linear-gradient(160deg,var(--warm1),var(--warm2));color:#7a4300}
.card .face .txt{font-size:clamp(13px,3.3vw,20px);line-height:1.22;word-break:break-word;max-width:100%}
.card .face .txt.mid{font-size:clamp(11px,2.7vw,16px)}
.card .face .txt.small{font-size:clamp(10px,2.2vw,13px)}
.card .face .ph{margin-top:3px;font-size:clamp(8px,1.8vw,10px);font-weight:600;opacity:.72}
@media (hover:hover){.card:hover{transform:translateY(-3px)}}
.card:active{transform:scale(.97)}
.card.sel{
  z-index:2;transform:translateY(-4px) scale(1.04);
  box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(108,99,255,.42),0 12px 22px rgba(108,99,255,.24);
}
.card.sel .face::after{
  content:"";position:absolute;inset:0;border-radius:14px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.9);
}
.card.matched{pointer-events:none;animation:pop .5s cubic-bezier(.34,1.4,.64,1) forwards}
.card.matched .face{background:linear-gradient(160deg,#8fe3c2,#2fc48d);color:#fff;box-shadow:0 6px 14px rgba(47,196,141,.26)}
.card.matched .face .txt::after{content:" ✓"}
@keyframes pop{
  0%{transform:scale(1)}
  34%{transform:scale(1.13)}
  70%{transform:scale(1.02);opacity:1}
  100%{transform:scale(.86);opacity:0;visibility:hidden}
}
.card.wrong{animation:shake .44s ease}
.card.wrong .face{box-shadow:0 0 0 3px var(--bad),0 6px 14px rgba(255,122,138,.26)}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px) rotate(-1deg)}
  52%{transform:translateX(7px) rotate(1deg)}
  78%{transform:translateX(-3px)}
}

/* ---------- 加载 / 错误 ---------- */
.loading{
  text-align:center;color:var(--muted);font-size:13.5px;padding:36px 0;
}
.loading .spinner{
  width:26px;height:26px;margin:0 auto 12px;border-radius:50%;
  border:3px solid #dbe6ff;border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
  background:#fff;border-radius:16px;padding:20px;text-align:center;color:#b25b5b;
  font-size:13.5px;box-shadow:var(--shadow);line-height:1.7;
}

/* ---------- 弹层 ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(30,42,70,.42);backdrop-filter:blur(6px);
}
.overlay.show{display:flex;animation:fadeUp .22s ease both}
.dialog{
  width:100%;max-width:380px;background:#fff;border-radius:22px;
  padding:26px 22px 22px;text-align:center;
  box-shadow:0 26px 56px rgba(24,48,88,.26);
  animation:zoomIn .32s cubic-bezier(.34,1.5,.64,1) both;
}
@keyframes zoomIn{from{transform:scale(.84);opacity:0}to{transform:scale(1);opacity:1}}
.dialog .big{font-size:44px;line-height:1}
.dialog h2{margin:8px 0 4px;font-size:21px}
.dialog .sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.score-row{display:flex;gap:9px;margin-bottom:18px}
.score-row > div{flex:1;background:#f4f6ff;border-radius:14px;padding:11px 5px}
.score-row .v{font-size:19px;font-weight:800;color:var(--primary)}
.score-row .k{font-size:11px;color:var(--muted);margin-top:3px}
.btn-main{
  width:100%;border:none;cursor:pointer;font-family:inherit;
  padding:14px 0;border-radius:14px;font-size:16px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#4f9fff,#6c63ff);
  box-shadow:0 8px 20px rgba(108,99,255,.3);
  transition:transform .15s ease;margin-bottom:9px;
}
.btn-main:active{transform:scale(.97)}
.btn-ghost{
  width:100%;border:1.5px solid #e2ecfb;cursor:pointer;font-family:inherit;
  padding:12px 0;border-radius:14px;font-size:15px;font-weight:700;
  color:#6c819f;background:#fff;transition:transform .15s ease;
}
.btn-ghost:active{transform:scale(.97)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>

<div class="topbar">
  <button id="btnBack" aria-label="返回">←</button>
  <h1>🎴 单词消消乐</h1>
  <button id="btnSound" aria-label="声音开关">🔊</button>
</div>

<div class="container">
  <div class="crumb" id="crumb">选择年级开始</div>

  <!-- 选年级 -->
  <section class="view active" id="viewGrade">
    <p class="hint">每局 8 个单词（16 张卡），把本单元所有单词都消除完，才算「本单元完成」。</p>
    <div class="loading" id="loading"><div class="spinner"></div>正在加载单词…</div>
    <div class="grade-grid" id="gradeGrid"></div>
  </section>

  <!-- 选单元 -->
  <section class="view" id="viewUnit">
    <div class="sem-tabs" id="semTabs">
      <button data-sem="上册" class="on">上册</button>
      <button data-sem="下册">下册</button>
    </div>
    <div class="unit-grid" id="unitGrid"></div>
  </section>

  <!-- 游戏 -->
  <section class="view" id="viewGame">
    <div class="game-hud">
      <div class="stat">本局 <b id="hudMatched">0/0</b></div>
      <div class="bar"><i id="hudBar"></i></div>
      <div class="stat">用时 <b id="hudTime">0:00</b></div>
      <button class="reset-btn" id="btnReset">重开</button>
    </div>
    <div class="unit-line">
      <span id="unitProgress">本单元已消除 0 / 0</span>
      <span class="track"><i id="unitBar"></i></span>
    </div>
    <div class="board" id="board"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="big" id="dlgIcon">🎉</div>
    <h2 id="dlgTitle">本单元完成！</h2>
    <div class="sub" id="dlgSub">全部配对成功，真棒！</div>
    <div class="score-row">
      <div><div class="v" id="dlgTime">0:00</div><div class="k">本局用时</div></div>
      <div><div class="v" id="dlgWords">0</div><div class="k">本局词数</div></div>
      <div><div class="v" id="dlgAcc">0%</div><div class="k">准确率</div></div>
    </div>
    <button class="btn-main" id="btnAgain">继续下一局</button>
    <button class="btn-ghost" id="btnBackUnits">返回单元选择</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* =========================================================
   单词数据：与主程序共用 ./data/words.json（单一数据源）
   —— 以后只改 data/words.json，主程序与消消乐同时生效
   ========================================================= */
let wordData = {};

const WORDS_PER_ROUND = 8;                    // 每局单词数（卡片数 = 该值 × 2）
const STORE_KEY = 'xxl_done_units_v2';        // 已完成单元记录
const PROGRESS_KEY = 'xxl_unit_progress_v1';  // 单元内已消除的单词

const GN = { '三': '三年级', '四': '四年级', '五': '五年级' };
const SN = { '上': '上册', '下': '下册' };

function buildWordData(words, textbook){
  const tb = (textbook && textbook['外研社']) || textbook || {};
  const buckets = {};

  (words || []).forEach((w) => {
    const m = /^([三四五])([上下])(\d+)$/.exec(String(w.module || ''));
    if (!m) return;
    const g = GN[m[1]], sem = SN[m[2]], num = parseInt(m[3], 10);
    if (!buckets[g]) buckets[g] = {};
    if (!buckets[g][sem]) buckets[g][sem] = {};
    if (!buckets[g][sem][num]) buckets[g][sem][num] = [];
    buckets[g][sem][num].push(w);
  });

  const out = {};
  ['三年级', '四年级', '五年级'].forEach((g) => {
    if (!buckets[g]) return;
    out[g] = {};
    ['上册', '下册'].forEach((sem) => {
      const nums = Object.keys(buckets[g][sem] || {}).map(Number).sort((a, b) => a - b);
      const titles = Object.keys((tb[g] || {})[sem] || {});
      nums.forEach((num) => {
        // 三年级上册从 0 开始（0 = Welcome），其余学期 num 从 1 开始
        const ti = (g === '三年级' && sem === '上册') ? num : num - 1;
        const title = titles[ti] || ('Unit ' + num);
        const key = g.charAt(0) + sem.charAt(0) + num;
        out[g][key] = {
          title: title,
          words: buckets[g][sem][num].map((w) => ({
            en: w.word,
            cn: w.chinese,
            ph: w.phonetic || ''
          }))
        };
      });
    });
  });
  return out;
}

async function loadWordData(){
  const [wRes, tRes] = await Promise.all([
    fetch('./data/words.json', { cache: 'no-cache' }),
    fetch('./data/textbook.json', { cache: 'no-cache' }).catch(() => null)
  ]);
  if (!wRes.ok) throw new Error('words.json ' + wRes.status);
  const words = await wRes.json();
  let textbook = {};
  try { textbook = tRes && tRes.ok ? await tRes.json() : {}; } catch (e) { textbook = {}; }
  return buildWordData(Array.isArray(words) ? words : (words.words || []), textbook);
}

/* =========================================================
   工具
   ========================================================= */
const $ = (s) => document.querySelector(s);
const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function fmtTime(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function loadJSON(key){
  try { return JSON.parse(localStorage.getItem(key) || '{}'); }
  catch (e) { return {}; }
}
function saveJSON(key, obj){
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
}
function loadDone(){ return loadJSON(STORE_KEY); }
function saveDone(key, rec){
  const d = loadDone();
  if (!d[key] || rec.sec < d[key].sec) d[key] = rec;
  saveJSON(STORE_KEY, d);
}
function getCleared(key){
  const all = loadJSON(PROGRESS_KEY);
  return Array.isArray(all[key]) ? all[key] : [];
}
function setCleared(key, list){
  const all = loadJSON(PROGRESS_KEY);
  all[key] = list;
  saveJSON(PROGRESS_KEY, all);
}
function clearUnitProgress(key){
  const all = loadJSON(PROGRESS_KEY);
  delete all[key];
  saveJSON(PROGRESS_KEY, all);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- 音效 ---------- */
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx && (window.AudioContext || window.webkitAudioContext)){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, vol){
  if (!state.soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function sfxPick(){ tone(620, 0.09, 'triangle', 0.1); }
function sfxMatch(){ tone(784, 0.12, 'sine', 0.16); setTimeout(() => tone(1046, 0.18, 'sine', 0.14), 90); }
function sfxWrong(){ tone(220, 0.18, 'sawtooth', 0.09); }
function sfxWin(){ [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'sine', 0.14), i * 110)); }

/* ---------- 英文朗读 ---------- */
function speak(word){
  if (!state.soundOn) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.88;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* =========================================================
   状态
   ========================================================= */
const state = {
  grade: '', sem: '上册', unitKey: '',
  cards: [], first: null, lock: false,
  matched: 0, total: 0, moves: 0,
  clearedBefore: [], unitTotal: 0, roundEns: [],
  startAt: 0, timer: null, soundOn: true, cols: 4
};

/* =========================================================
   视图
   ========================================================= */
function showView(id){
  ['viewGrade', 'viewUnit', 'viewGame'].forEach((v) => {
    document.getElementById(v).classList.toggle('active', v === id);
  });
  if (id === 'viewGrade') $('#crumb').textContent = '选择年级开始';
  window.scrollTo(0, 0);
}

/* =========================================================
   年级页
   ========================================================= */
const GRADE_ICON = { '三年级': '🌱', '四年级': '🌿', '五年级': '🌳' };

function renderGrades(){
  const box = $('#gradeGrid');
  box.innerHTML = '';
  Object.keys(wordData).forEach((g) => {
    const units = wordData[g];
    let words = 0, count = 0;
    Object.keys(units).forEach((k) => { words += units[k].words.length; count++; });

    const btn = document.createElement('button');
    btn.className = 'grade-card';
    btn.innerHTML =
      '<span class="emoji">' + (GRADE_ICON[g] || '📘') + '</span>' +
      '<span><div class="gname">' + g + '</div>' +
      '<div class="gmeta">' + count + ' 个单元 · ' + words + ' 个单词</div></span>' +
      '<span class="arrow">→</span>';
    btn.addEventListener('click', () => openGrade(g));
    box.appendChild(btn);
  });
}

function openGrade(g){
  state.grade = g;
  state.sem = '上册';
  document.querySelectorAll('#semTabs button').forEach((b) => {
    b.classList.toggle('on', b.dataset.sem === state.sem);
  });
  renderUnits();
  showView('viewUnit');
}

/* =========================================================
   单元页
   ========================================================= */
function renderUnits(){
  const box = $('#unitGrid');
  box.innerHTML = '';
  const units = wordData[state.grade] || {};
  const done = loadDone();
  const semChar = state.sem.charAt(0);

  Object.keys(units).forEach((key) => {
    if (key.indexOf(semChar) < 0) return;
    const unit = units[key];
    const num = key.replace(/\D/g, '');
    const label = (num === '0') ? '预备单元' : ('Unit ' + num);
    const rec = done[key];
    const ens = unit.words.map((w) => w.en);
    const cleared = getCleared(key).filter((e) => ens.indexOf(e) >= 0).length;
    const full = cleared >= ens.length;

    let meta = unit.words.length + ' 个单词';
    if (full){ meta += ' · 已全部消除'; }
    else if (cleared > 0){ meta += ' · 已消除 ' + cleared; }
    if (rec) meta += ' · 最佳 ' + fmtTime(rec.sec);

    const badge = rec ? '<span class="badge">已完成</span>'
      : (cleared > 0 ? '<span class="badge doing">进行中</span>' : '');

    const btn = document.createElement('button');
    btn.className = 'unit-card';
    btn.innerHTML =
      badge +
      '<span class="ukey">' + state.grade + state.sem + ' · ' + label + '</span>' +
      '<span class="utitle">' + unit.title + '</span>' +
      '<span class="umeta">' + meta + '</span>';
    btn.addEventListener('click', () => startGame(key));
    box.appendChild(btn);
  });

  $('#crumb').textContent = state.grade + ' · ' + state.sem;
}

/* =========================================================
   开局
   ========================================================= */
function startGame(key){
  ensureAudio();
  state.unitKey = key;
  const unit = wordData[state.grade][key];
  const allEns = unit.words.map((w) => w.en);

  let cleared = getCleared(key).filter((e) => allEns.indexOf(e) >= 0);
  if (cleared.length >= allEns.length){
    clearUnitProgress(key);
    cleared = [];
  }

  const clearedSet = new Set(cleared);
  const remaining = unit.words.filter((w) => !clearedSet.has(w.en));

  state.clearedBefore = cleared;
  state.unitTotal = allEns.length;

  const n = Math.min(remaining.length, WORDS_PER_ROUND);
  const picked = shuffle(remaining.slice()).slice(0, n);
  state.roundEns = picked.map((w) => w.en);

  state.total = n;
  state.matched = 0;
  state.moves = 0;
  state.first = null;
  state.lock = false;
  state.startAt = Date.now();

  document.getElementById('overlay').classList.remove('show');
  $('#crumb').textContent = state.grade + ' · ' + state.sem + ' · ' + unit.title;

  buildBoard(picked);
  startTimer();
  updateHud();
  showView('viewGame');
}

function computeCols(count){
  const w = window.innerWidth;
  if (w <= 420) return count <= 12 ? 3 : (count <= 18 ? 4 : 5);
  if (w <= 640) return count <= 12 ? 4 : (count <= 18 ? 4 : 5);
  if (count <= 16) return 4;
  if (count <= 20) return 5;
  return 6;
}

function buildBoard(picked){
  const board = $('#board');
  board.innerHTML = '';

  const cards = [];
  picked.forEach((w, i) => {
    cards.push({ pair: i, type: 'en', w: w });
    cards.push({ pair: i, type: 'cn', w: w });
  });
  shuffle(cards);
  state.cards = cards;
  state.cols = computeCols(cards.length);
  board.style.setProperty('--cols', state.cols);

  cards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.pair = c.pair;
    el.dataset.type = c.type;
    el.dataset.word = c.w.en;
    el.style.setProperty('--d', (i * 22) + 'ms');

    const txt = (c.type === 'en') ? c.w.en : c.w.cn;
    const sizeCls = txt.length >= 12 ? ' small' : (txt.length >= 8 ? ' mid' : '');
    const ph = (c.type === 'en' && c.w.ph) ? '<div class="ph">' + escapeHtml(c.w.ph) + '</div>' : '';

    el.innerHTML =
      '<div class="face ' + c.type + '">' +
        '<div class="txt' + sizeCls + '">' + escapeHtml(txt) + '</div>' + ph +
      '</div>';

    el.addEventListener('click', () => onCardClick(el));
    board.appendChild(el);
  });
}

/* =========================================================
   配对
   ========================================================= */
function onCardClick(el){
  ensureAudio();
  if (state.lock) return;
  if (el.classList.contains('matched')) return;

  if (el === state.first){
    el.classList.remove('sel');
    state.first = null;
    return;
  }

  el.classList.add('sel');
  sfxPick();
  if (el.dataset.type === 'en') speak(el.dataset.word);

  if (!state.first){ state.first = el; return; }

  const a = state.first;
  const b = el;
  state.first = null;
  state.moves++;

  const isMatch = a.dataset.pair === b.dataset.pair && a.dataset.type !== b.dataset.type;

  if (isMatch){
    sfxMatch();
    setTimeout(() => {
      a.classList.remove('sel');
      b.classList.remove('sel');
      a.classList.add('matched');
      b.classList.add('matched');
      state.matched++;
      updateHud();
      if (state.matched === state.total) setTimeout(finish, 620);
    }, 200);
  } else {
    sfxWrong();
    state.lock = true;
    a.classList.remove('sel');
    b.classList.remove('sel');
    a.classList.add('wrong');
    b.classList.add('wrong');
    setTimeout(() => {
      a.classList.remove('wrong');
      b.classList.remove('wrong');
      state.lock = false;
    }, 760);
  }
}

function updateHud(){
  $('#hudMatched').textContent = state.matched + '/' + state.total;
  $('#hudBar').style.width = (state.total ? (state.matched / state.total * 100) : 0) + '%';

  const cleared = (state.clearedBefore ? state.clearedBefore.length : 0) + state.matched;
  $('#unitProgress').textContent = '本单元已消除 ' + cleared + ' / ' + state.unitTotal;
  $('#unitBar').style.width = (state.unitTotal ? Math.min(cleared / state.unitTotal * 100, 100) : 0) + '%';
}

/* =========================================================
   计时 / 通关
   ========================================================= */
function startTimer(){
  stopTimer();
  $('#hudTime').textContent = '0:00';
  state.timer = setInterval(() => {
    $('#hudTime').textContent = fmtTime(Math.floor((Date.now() - state.startAt) / 1000));
  }, 500);
}
function stopTimer(){
  if (state.timer){ clearInterval(state.timer); state.timer = null; }
}

function finish(){
  stopTimer();
  const sec = Math.max(1, Math.round((Date.now() - state.startAt) / 1000));
  const acc = Math.round(state.total / Math.max(state.moves, state.total) * 100);

  const merged = Array.from(new Set((state.clearedBefore || []).concat(state.roundEns || [])));
  setCleared(state.unitKey, merged);

  const unitDone = merged.length >= state.unitTotal;
  const left = Math.max(state.unitTotal - merged.length, 0);

  $('#dlgIcon').textContent = unitDone ? '🎉' : '👍';
  $('#dlgTitle').textContent = unitDone ? '本单元完成！' : '本局完成！';
  $('#dlgSub').textContent = unitDone
    ? ('本单元 ' + state.unitTotal + ' 个单词全部消除，太棒了！')
    : ('本局 ' + state.total + ' 个词已消除，本单元还剩 ' + left + ' 个，继续加油！');
  $('#btnAgain').textContent = unitDone ? '重玩本单元' : '继续下一局';

  $('#dlgTime').textContent = fmtTime(sec);
  $('#dlgWords').textContent = state.total;
  $('#dlgAcc').textContent = acc + '%';
  $('#overlay').classList.add('show');

  if (unitDone){
    saveDone(state.unitKey, { sec: sec, words: state.total });
    confettiBurst();
  }
  sfxWin();
}

function confettiBurst(){
  const box = $('#confetti');
  box.innerHTML = '';
  const colors = ['#5aa9ff', '#ffca7a', '#2fc48d', '#ff8fa3', '#a78bfa', '#7dd3fc'];
  for (let i = 0; i < 44; i++){
    const p = document.createElement('i');
    p.style.left = (Math.random() * 100) + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (1.5 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    box.appendChild(p);
  }
  setTimeout(() => { box.innerHTML = ''; }, 3400);
}

/* =========================================================
   返回主程序
   ========================================================= */
function goApp(){
  const g = state.grade ? ('?grade=' + encodeURIComponent(state.grade)) : '';
  location.href = './index.html' + g;
}

/* =========================================================
   事件
   ========================================================= */
$('#btnBack').addEventListener('click', () => {
  if (document.getElementById('viewGame').classList.contains('active')){
    stopTimer();
    renderUnits();
    showView('viewUnit');
    return;
  }
  if (document.getElementById('viewUnit').classList.contains('active')){
    showView('viewGrade');
    return;
  }
  goApp();
});

$('#btnSound').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  $('#btnSound').textContent = state.soundOn ? '🔊' : '🔇';
  if (!state.soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
});

$('#btnReset').addEventListener('click', () => {
  if (state.unitKey) startGame(state.unitKey);
});

$('#btnAgain').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
  startGame(state.unitKey);
});

$('#btnBackUnits').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
  renderUnits();
  showView('viewUnit');
});

document.querySelectorAll('#semTabs button').forEach((b) => {
  b.addEventListener('click', () => {
    state.sem = b.dataset.sem;
    document.querySelectorAll('#semTabs button').forEach((x) => x.classList.toggle('on', x === b));
    renderUnits();
  });
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!state.cards.length) return;
    const cols = computeCols(state.cards.length);
    if (cols !== state.cols){
      state.cols = cols;
      $('#board').style.setProperty('--cols', cols);
    }
  }, 160);
});

/* =========================================================
   启动
   ========================================================= */
(async function init(){
  try {
    wordData = await loadWordData();
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';

    if (!Object.keys(wordData).length){
      $('#gradeGrid').innerHTML = '<div class="error-box">没有读取到单词数据<br>请确认 data/words.json 存在且格式正确</div>';
      return;
    }

    renderGrades();
    showView('viewGrade');

    // 从主程序带过来的年级，直接进入单元页
    let g = '';
    try { g = new URLSearchParams(location.search).get('grade') || ''; } catch (e) {}
    if (g && wordData[g]) openGrade(g);
  } catch (e) {
    console.error(e);
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
    $('#gradeGrid').innerHTML =
      '<div class="error-box">单词数据加载失败：' + escapeHtml(e.message) + '<br>请确认 data/words.json 可访问</div>';
  }
})();
</script>
