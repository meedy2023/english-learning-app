<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>英语学习小助手</title>
  <style>
    /* ========== 基础重置 ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f0f4ff;
      color: #333;
      min-height: 100vh;
    }

    /* ========== 顶部导航 ========== */
    .topbar {
      background: linear-gradient(135deg, #4f9fff, #6c63ff);
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(79, 159, 255, 0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar-right { font-size: 13px; opacity: 0.9; }

    /* ========== 页面容器 ========== */
    .container { max-width: 480px; margin: 0 auto; padding: 16px 16px 80px; }

    /* ========== 视图切换 ========== */
    .view { display: none; }
    .view.active { display: block; }

    /* ========== 模块列表 ========== */
    .section-title {
      font-size: 15px;
      color: #6c63ff;
      font-weight: 600;
      margin: 20px 0 12px 4px;
    }

    .module-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .module-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      border-left: 4px solid #4f9fff;
    }
    .module-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .module-card .module-name { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 6px; }
    .module-card .module-count { font-size: 12px; color: #999; }
    .module-card .progress-bar {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .module-card .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f9fff, #6c63ff);
      border-radius: 3px;
      transition: width 0.4s;
    }
    .module-card .progress-text { font-size: 11px; color: #aaa; margin-top: 4px; text-align: right; }

    /* ========== 单词卡片 ========== */
    .word-detail-card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin-top: 12px;
      text-align: center;
    }
    .word-text {
      font-size: 42px;
      font-weight: 800;
      color: #2d2d2d;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .word-phonetic {
      font-size: 18px;
      color: #999;
      margin-bottom: 16px;
      font-family: 'Georgia', serif;
    }
    .word-chinese {
      font-size: 22px;
      color: #6c63ff;
      margin-bottom: 16px;
    }
    .word-example {
      background: #f5f5ff;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 6px;
    }
    .word-example-cn {
      font-size: 13px;
      color: #999;
      margin-top: 6px;
    }
    .word-type-badge {
      display: inline-block;
      background: #e8eeff;
      color: #6c63ff;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    /* ========== 按钮 ========== */
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #4f9fff, #6c63ff);
      color: white;
      width: 100%;
      margin-top: 12px;
    }
    .btn-secondary {
      background: #f0f0f8;
      color: #6c63ff;
    }
    .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 8px; }
    .btn-icon {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 8px;
      color: #6c63ff;
    }

    /* ========== 单词列表（在学习视图） ========== */
    .word-list { margin-top: 12px; }
    .word-item {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.1s;
    }
    .word-item:active { transform: scale(0.98); }
    .word-item-left { display: flex; flex-direction: column; }
    .word-item-word { font-size: 17px; font-weight: 600; color: #333; }
    .word-item-phonetic { font-size: 12px; color: #aaa; margin-top: 2px; font-family: 'Georgia', serif; }
    .word-item-chinese { font-size: 14px; color: #6c63ff; }
    .word-status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ddd;
      flex-shrink: 0;
    }
    .word-status-dot.learned { background: #4f9fff; }
    .word-status-dot.mastered { background: #52c41a; }

    /* ========== 发音按钮 ========== */
    .speak-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 8px 12px;
      color: #4f9fff;
      border: 1.5px solid #4f9fff;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .speak-btn:hover { background: #e8f2ff; }

    /* ========== 底部导航 ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: white;
      display: flex;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      cursor: pointer;
      font-size: 12px;
      color: #999;
      transition: color 0.15s;
    }
    .nav-item.active { color: #6c63ff; font-weight: 600; }
    .nav-item-icon { font-size: 22px; display: block; margin-bottom: 4px; }

    /* ========== 测验视图 ========== */
    .quiz-card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      margin-top: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .quiz-prompt {
      font-size: 16px;
      color: #666;
      margin-bottom: 16px;
    }
    .quiz-word {
      font-size: 40px;
      font-weight: 800;
      color: #333;
      margin-bottom: 20px;
    }
    .quiz-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }
    .quiz-input:focus { border-color: #6c63ff; }

    /* ========== 结果反馈 ========== */
    .result-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      display: none;
    }
    .result-card {
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    .result-emoji { font-size: 64px; margin-bottom: 16px; }
    .result-score { font-size: 56px; font-weight: 800; color: #6c63ff; }
    .result-label { font-size: 14px; color: #999; margin-top: 4px; }
    .result-feedback { font-size: 16px; color: #555; margin: 16px 0; line-height: 1.5; }
    .result-correct {
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 15px;
      color: #52c41a;
      margin-bottom: 20px;
    }

    /* ========== 学习报告 ========== */
    .report-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .report-total {
      font-size: 48px;
      font-weight: 800;
      color: #6c63ff;
      text-align: center;
    }
    .report-total-label { text-align: center; color: #999; font-size: 13px; margin-top: 4px; }
    .report-stats {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .report-stat {
      flex: 1;
      background: #f5f5ff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .report-stat-num { font-size: 24px; font-weight: 700; color: #333; }
    .report-stat-label { font-size: 11px; color: #999; margin-top: 4px; }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 300;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ========== 加载动画 ========== */
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #e0e0e0;
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== 进度圆圈 ========== */
    .circle-progress {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: conic-gradient(#6c63ff var(--pct, 0%), #e0e0e0 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .circle-progress-inner {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #6c63ff;
    }

    /* ========== 空状态 ========== */
    .empty-state { text-align: center; padding: 40px 20px; color: #aaa; }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; }

    /* ========== 年级按钮 ========== */
    .grade-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px 28px;
      background: #fff;
      border: 2px solid #e0e6ff;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }
    .grade-btn:hover, .grade-btn:active {
      background: #6c63ff;
      border-color: #6c63ff;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108,99,255,0.35);
    }
    .grade-btn .grade-icon {
      font-size: 32px;
    }
    .grade-btn .grade-info {
      text-align: left;
    }
    .grade-btn .grade-name {
      font-size: 20px;
      font-weight: 700;
    }
    .grade-btn .grade-desc {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 2px;
    }
    .grade-btn:hover .grade-desc,
    .grade-btn:active .grade-desc {
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <h1 id="topbar-title">📚 单词学习</h1>
  <div class="topbar-right" id="topbar-right">三年级</div>
</div>

<div class="container">

  <!-- ======= 年级选择页 ======= -->
  <div id="view-grade" class="view active">
    <div class="topbar">
      <div class="topbar-title">英语学习助手</div>
      <div class="topbar-right" id="topbar-right">外研版</div>
    </div>
    <div class="section-title" style="margin-top:32px">请选择年级</div>
    <div class="grade-grid" id="grade-grid" style="margin-top:20px;display:flex;flex-direction:column;gap:16px;padding:0 24px">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- ======= 首页：模块列表 ======= -->
  <div id="view-home" class="view">
    <div class="section-title">选择模块开始学习</div>
    <div class="module-grid" id="module-grid">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- ======= 学习：单词列表 ======= -->
  <div id="view-learn" class="view">
    <button class="btn btn-secondary" onclick="switchView('home')" style="margin-bottom:12px;display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:14px;border-radius:10px;background:#f5f7ff;border:1px solid #e0e6ff;color:#6c63ff;font-weight:500"><span style="font-size:16px">←</span> 返回首页</button>
    <div class="section-title" id="learn-module-title">上册 Module 1</div>
    <div id="quiz-toggle-bar" style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="showWordList()">📖 单词表</button>
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="startChoiceLearn()">🎯 单词学习</button>
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="showTextbookList()">📖 课文学习</button>
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="startQuiz()">✏️ 闯关测验</button>
    </div>
    <div class="word-list" id="word-list"></div>
    <div id="word-detail-area" style="display:none"></div>
    <!-- 选择题学习区 -->
    <div id="choice-learn-area" style="display:none"></div>
  </div>

  <!-- ======= 测验 ======= -->
  <div id="view-quiz" class="view">
    <button class="btn btn-secondary" onclick="showWordList()" style="margin-bottom:16px;display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:14px;border-radius:10px;background:#f5f7ff;border:1px solid #e0e6ff;color:#6c63ff;font-weight:500"><span style="font-size:16px">←</span> 返回单词表</button>
    <div class="quiz-card">
      <div class="quiz-prompt" id="quiz-prompt">这个单词的中文是什么意思？</div>
      <div class="quiz-word" id="quiz-word">hello</div>
      <div style="margin-bottom:16px">
        <button class="speak-btn" id="quiz-speak-btn" onclick="speakQuizWord()">🔊 听发音</button>
      </div>
      <!-- 选择题选项区 -->
      <div id="quiz-options" style="display:flex;flex-direction:column;gap:10px;margin-top:12px"></div>
      <!-- 反馈区 -->
      <div id="quiz-feedback" style="display:none;margin-top:16px;text-align:center;padding:14px;border-radius:12px;font-size:15px"></div>
      <button class="btn btn-primary" id="quiz-next-btn" onclick="nextQuizQuestion()" style="display:none;margin-top:12px;width:100%">下一题 →</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="skipQuiz()">跳过 →</button>
    </div>
    <div id="quiz-hint" style="text-align:center;margin-top:12px;color:#bbb;font-size:13px">第 <span id="quiz-num">1</span> / <span id="quiz-total">0</span> 题</div>
  </div>


<!-- 课文学习：列表页 -->
<div id="view-lesson-list" class="view">
    <button class="btn btn-secondary" onclick="switchView('home')" style="margin-bottom:12px;display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:14px;border-radius:10px;background:#f5f7ff;border:1px solid #e0e6ff;color:#6c63ff;font-weight:500"><span style="font-size:16px">←</span> 返回首页</button>
    <div class="section-title">选择模块开始学习</div>
    <div class="module-grid" id="lesson-module-grid">
        <div class="spinner"></div>
    </div>
</div>

<!-- 课文学习：详情页 -->
<div id="view-lesson-detail" class="view">
    <button class="btn btn-secondary" onclick="showLessonList()" style="margin-bottom:12px;display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:14px;border-radius:10px;background:#f5f7ff;border:1px solid #e0e6ff;color:#6c63ff;font-weight:500"><span style="font-size:16px">←</span> 返回模块列表</button>
    <div class="section-title" id="lesson-unit-title">课文标题</div>
    
    <div class="word-detail-card" style="text-align: left;">
        <h3 style="margin-bottom: 16px; color: #333;">对话原文</h3>
        <div id="lesson-dialogue-container" style="line-height: 2;">
            <!-- 对话内容将由JS动态插入 -->
        </div>
        <button class="speak-btn" onclick="speakCurrentLesson()" style="margin-top: 20px; width: 100%;">🔊 朗读整篇课文</button>
    </div>

    <div class="word-detail-card" style="margin-top: 16px; text-align: left;">
        <h3 style="margin-bottom: 16px; color: #333;">中文翻译</h3>
        <div id="lesson-translation-container" style="line-height: 2; color: #666;">
            <!-- 翻译内容将由JS动态插入 -->
        </div>
    </div>
</div>

  <!-- ======= 学习报告 ======= -->
  <div id="view-report" class="view">
    <div class="section-title">总体学习报告</div>
    <div class="report-card" style="text-align:center">
      <div class="circle-progress" style="--pct: 0%">
        <div class="circle-progress-inner" id="total-percent">0%</div>
      </div>
      <div style="font-size:13px;color:#999;margin-bottom:16px">总体完成进度</div>
      <div class="report-stats">
        <div class="report-stat">
          <div class="report-stat-num" id="stat-total">0</div>
          <div class="report-stat-label">总单词</div>
        </div>
        <div class="report-stat">
          <div class="report-stat-num" id="stat-learned">0</div>
          <div class="report-stat-label">已学习</div>
        </div>
        <div class="report-stat">
          <div class="report-stat-num" id="stat-mastered">0</div>
          <div class="report-stat-label">已掌握</div>
        </div>
      </div>
    </div>
    <div class="section-title">各模块进度</div>
    <div id="report-modules"></div>
  </div>

  <!-- ======= KET 学习 ======= -->
  <div id="view-ket" class="view">
    <div class="section-title">📚 KET 学习</div>
    <div id="ket-category-list" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <!-- 分类列表由 JS 动态生成 -->
    </div>
    <div id="ket-content-area" style="display:none">
      <button class="btn btn-secondary" onclick="backToKetCategories()" style="margin-bottom:12px">
        ← 返回分类
      </button>
      <div id="ket-content-title" style="font-size:18px;font-weight:600;margin-bottom:16px"></div>
      <div id="ket-content-list"></div>
    </div>
  </div>

</div>

<!-- 结果弹窗 -->
<div class="result-overlay" id="result-overlay">
  <div class="result-card">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-score" id="result-score">100</div>
    <div class="result-label">分</div>
    <div class="result-feedback" id="result-feedback">太棒了！完全正确！</div>
    <div class="result-correct" id="result-correct" style="display:none">
      正确答案：<span id="result-correct-text"></span>
    </div>
    <button class="btn btn-primary" onclick="nextQuestion()">下一题 →</button>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script src="api-shim.js"></script>
<script>
  // ========== 全局状态 ==========
const API = ".";
  let USER_ID = localStorage.getItem("user_id") || ("user_" + Math.random().toString(36).substr(2, 8));
  localStorage.setItem("user_id", USER_ID);

  let currentModule = null;
  let currentWords = [];
  let currentQuizIndex = 0;
  let currentQuizMode = "en_to_cn"; // "en_to_cn" | "cn_to_en"
  let quizOrder = []; // 打乱顺序的单词ID列表

  // 课文学习相关状态
  let currentLessonModule = null;
  let currentLessonData = null;
  let currentLessonGrade = '三年级上册';

  // ========== 工具函数 ==========
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  let currentView = 'home';
  function switchView(name) {
    // 学习页面内点击学习导航，不重复切换
    if (name === 'learn' && currentView === 'learn') return;
    currentView = name;
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
    const titles = { grade: "英语学习助手", home: "📚 英语学习", learn: "📖 单词学习", quiz: "✏️ 测验", report: "📊 学习报告", ket: "📚 KET 学习" };
    document.getElementById("topbar-title").textContent = titles[name] || "";

    const colors = {

      'Daming': '#52c41a',
      'Lingling': '#fa8c16',
      'Ms Smart': '#722ed1',

  function escapeForJS(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
  }

  function speakLine(text) {
    speakWord(text);
  }

  function speakAllLessonLines(content) {
    if (!content || content.length === 0) {
      toast('没有可朗读的内容');
      return;
    }
    
    let delay = 0;
    content.forEach((line, idx) => {
      setTimeout(() => {
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(line.text);
        utter.lang = 'en-US';
        utter.rate = 0.7;
        const voices = speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang.startsWith('en'));
        if (enVoice) utter.voice = enVoice;
        speechSynthesis.speak(utter);
      }, delay);
      delay += 3500; // 每句间隔3.5秒
    });
    
    toast('开始朗读整篇课文...');
  }

  // ========== TTS 发音 ==========
  function speakWord(word) {
    if (!word) { toast("没有可发音的内容"); return; }
    if (!window.speechSynthesis) { toast("当前浏览器不支持发音功能"); return; }
    try {
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      utter.lang = "en-US";
      utter.rate = 0.7;
      utter.pitch = 1.1;
      // 等待 voices 加载
      const voices = speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith("en"));
      if (enVoice) utter.voice = enVoice;
      speechSynthesis.speak(utter);
    } catch (e) { toast("发音失败: " + e.message); }
  }

  function speakChinese(text) {
    if (!text) return;
    if (!window.speechSynthesis) { toast("当前浏览器不支持发音功能"); return; }
    try {
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-CN";
      const voices = speechSynthesis.getVoices();
      const zhVoice = voices.find(v => v.lang.startsWith("zh"));
      if (zhVoice) utter.voice = zhVoice;
      speechSynthesis.speak(utter);
    } catch (e) { toast("发音失败"); }
  }


  function speakAll(word, chinese, exampleEn, exampleCn) {
    // 朗读顺序：单词 -> 中文 -> 英文例句 -> 例句中文
    const parts = [
      { text: word,       lang: 'en-US', delay: 600 },
      { text: chinese,    lang: 'zh-CN', delay: 800 },
      { text: exampleEn,  lang: 'en-US', delay: 1000 },
      { text: exampleCn,  lang: 'zh-CN', delay: 0   },
    ];
    let delay = 300;
    for (const p of parts) {
      setTimeout(() => {
        if (!p.text) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(p.text);
        u.lang = p.lang;
        u.rate = p.lang === 'en-US' ? 0.7 : 0.85;
        const vlist = speechSynthesis.getVoices();
        const v = vlist.find(x => x.lang.startsWith(p.lang.slice(0, 2)));
        if (v) u.voice = v;
        speechSynthesis.speak(u);
      }, delay);
      delay += p.delay + 200;
    }
  }

  // 提前加载 voices（某些浏览器需要）
  if (window.speechSynthesis) {
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    speechSynthesis.getVoices();
  }

  // ========== API 请求 ==========
  async function apiGET(path) {
    const res = await fetch(API + path);
    if (!res.ok) throw new Error(`API 错误: ${res.status}`);
    return res.json();
  }
  async function apiPOST(path, body) {
    const res = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`API 错误: ${res.status}`);
    return res.json();
  }

    }
  }

  // ========== 选择年级后进入首页 ==========
  function openGrade(grade) {
    currentGrade = grade;
    document.getElementById('topbar-right').textContent = grade;
    document.getElementById('topbar-right').style.display = '';
    switchView('home');
    loadModules();
  }

  // ========== 返回年级选择页 ==========
  function backToGrade() {
    currentGrade = '';
    switchView('grade');
  }

  // ========== 首页：加载模块（按年级过滤） ==========
  async function loadModules(grade) {
    const targetGrade = grade || currentGrade;
    try {
      const url = targetGrade ? `/api/modules?grade=${encodeURIComponent(targetGrade)}` : '/api/modules';
      const data = await apiGET(url);
      const progressData = await apiGET(`/api/progress/${USER_ID}`);
      const grid = document.getElementById("module-grid");
      grid.innerHTML = "";
      for (const m of data) {
        // 统一用 grade 字段（返回结构为 {module, grade, count}）
        const gradeKey = m.grade || targetGrade || '';
        const progKey = `${gradeKey}/${m.module}`;
        const prog = progressData[progKey] || { total: m.count, learned: 0, mastered: 0, percent: 0 };
        const pct = prog.learned > 0 ? Math.round(prog.learned / prog.total * 100) : 0;
        const card = document.createElement("div");
        card.className = "module-card";
        card.innerHTML = `
          <div class="module-name">${m.module}</div>
          <div class="module-count">${m.count} 个单词</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
          <div class="progress-text">${prog.learned}/${prog.total} 已学</div>
        `;
        card.onclick = () => openModule(m.module);
        grid.appendChild(card);
      }
    } catch (e) {
      document.getElementById("module-grid").innerHTML =
        `<div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <div>无法连接服务器</div>
          <div style="font-size:12px;margin-top:8px">请确保后端已启动：<br><code style="background:#eee;padding:2px 6px;border-radius:4px">uvicorn main:app --reload</code></div>
        </div>`;
    }
  }

  // ========== 模块：加载单词列表 ==========
  async function openModule(module) {
    currentModule = module;
    try {
      const data = await apiGET(`/api/words?module=${encodeURIComponent(module)}`);
      currentWords = data.words;
      document.getElementById("learn-module-title").textContent = "📖 " + module;
      switchView("learn");
      showWordList();
    } catch (e) { toast("加载失败: " + e.message); }
  }

  async function showWordList() {
    // 确保在学习视图
    switchView("learn");
    // 隐藏所有学习子视图
    document.getElementById("word-detail-area").style.display = "none";
    document.getElementById("choice-learn-area").style.display = "none";
    document.getElementById("view-quiz").classList.remove("active");
    document.getElementById("word-list").style.display = "block";
    document.getElementById("quiz-toggle-bar").style.display = "flex";
    const list = document.getElementById("word-list");
    list.innerHTML = "<div class='spinner'></div>";
    // 批量获取当前模块所有单词状态
    let wordStatuses = {};
    try {
      wordStatuses = await apiGET(`/api/word-status/${USER_ID}?module=${encodeURIComponent(currentModule)}`);
    } catch(e) { wordStatuses = {}; }
    list.innerHTML = "";
    for (const w of currentWords) {
      const status = wordStatuses[w.id] || "new";
      const item = document.createElement("div");
      item.className = "word-item";
      item.innerHTML = `
        <div class="word-item-left">
          <div class="word-item-word">${capitalize(w.word)}</div>
          <div class="word-item-phonetic">${w.phonetic}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="word-item-chinese">${w.chinese}</div>
          <div class="word-status-dot ${status}" title="${status === "new" ? "未学" : status === "learned" ? "已学" : "已掌握"}"></div>
        </div>
      `;
      item.onclick = () => showWordDetail(w);
      list.appendChild(item);
    }
  }

  async function getWordStatus(wordId) {
    try {
      const all = await apiGET(`/api/word-status/${USER_ID}?module=${encodeURIComponent(currentModule)}`);
      return all[wordId] || "new";
    } catch { return "new"; }
  }

  // ========== 单词详情 ==========
  function showWordDetail(w) {

    document.getElementById("quiz-toggle-bar").style.display = "none";
    const area = document.getElementById("word-detail-area");

  // ========== 标记单词状态 ==========
  async function markWord(wordId, status) {
    try {
      await apiPOST('/api/progress/' + USER_ID + '/' + wordId + '?status=' + status, {});
      toast(status === 'mastered' ? '⭐ 已掌握！' : '✓ 已学会！');
      // 刷新单词列表状态
      showWordList();
    } catch (e) {
      toast('标记失败：' + e.message);
    }
  }

  // ========== 测验 ==========
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startQuiz() {
    if (currentWords.length === 0) { toast("请先选择一个模块"); return; }
    quizOrder = shuffle(currentWords.map(w => w.id));
    currentQuizIndex = 0;
    window.quizResults = [];
    // 恢复显示跳过按钮和题号
    const skipBtn = document.querySelector('#view-quiz .btn-secondary[onclick="skipQuiz()"]');
    if (skipBtn) skipBtn.parentElement.style.display = "flex";
    document.getElementById("quiz-hint").style.display = "block";
    switchView("quiz");
    loadQuizQuestion();
  }

  function loadQuizQuestion() {
    if (currentQuizIndex >= quizOrder.length) {
      showQuizSummary();
      return;
    }
    // 重置反馈区
    document.getElementById("quiz-feedback").style.display = "none";
    document.getElementById("quiz-next-btn").style.display = "none";

    const wordId = quizOrder[currentQuizIndex];
    const w = currentWords.find(x => x.id === wordId);
    if (!w) { currentQuizIndex++; loadQuizQuestion(); return; }

    // 随机决定题型
    const mode = Math.random() > 0.5 ? "en_to_cn" : "cn_to_en";
    currentQuizMode = mode;

    if (mode === "en_to_cn") {
      document.getElementById("quiz-prompt").textContent = "这个单词的中文是？";
      document.getElementById("quiz-word").textContent = capitalize(w.word);
    } else {
      document.getElementById("quiz-prompt").textContent = "这个中文的英文是？";
      document.getElementById("quiz-word").textContent = w.chinese;
    }
    document.getElementById("quiz-num").textContent = currentQuizIndex + 1;
    document.getElementById("quiz-total").textContent = quizOrder.length;

    // 生成4个选项
    const others = currentWords.filter(x => x.id !== wordId);
    const distractors = shuffle(others).slice(0, 3);
    let options;
    if (mode === "en_to_cn") {
      options = shuffle([
        { text: w.chinese, correct: true, word: w },
        ...distractors.map(d => ({ text: d.chinese, correct: false, word: d }))
      ]);
    } else {
      options = shuffle([
        { text: w.word, correct: true, word: w },
        ...distractors.map(d => ({ text: d.word, correct: false, word: d }))
      ]);
    }

    // 渲染选项
    const optsContainer = document.getElementById("quiz-options");
    optsContainer.innerHTML = "";
    const labels = ["A", "B", "C", "D"];
    options.forEach(function(opt, i) {
      const btn = document.createElement("button");
      btn.className = "btn btn-secondary";
      btn.style.cssText = "width:100%;text-align:left;padding:14px 18px;font-size:16px;border-radius:12px;background:white;border:2px solid #e8eeff;color:#333;cursor:pointer;transition:all .15s";
      btn.innerHTML = '<span style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#f0f4ff;color:#6c63ff;font-size:13px;text-align:center;line-height:28px;font-weight:700;margin-right:10px">' + labels[i] + '</span><span>' + opt.text + '</span>';
      btn.onclick = function() { handleQuizChoice(btn, opt, w, mode); };
      optsContainer.appendChild(btn);
    });

    // 自动发音
    if (mode === "en_to_cn") setTimeout(function() { speakWord(w.word); }, 100);
  }

  function handleQuizChoice(btnEl, opt, correctWord, mode) {
    // 禁用所有选项
    document.querySelectorAll("#quiz-options button").forEach(function(b) {
      b.style.pointerEvents = "none";
    });

    const feedback = document.getElementById("quiz-feedback");
    const nextBtn = document.getElementById("quiz-next-btn");
    const isCorrect = opt.correct;

    // 记录本题结果用于判断是否全对
    if (!window.quizResults) window.quizResults = [];
    window.quizResults.push({ correct: isCorrect });

    if (isCorrect) {
      btnEl.style.background = "#f6ffed";
      btnEl.style.borderColor = "#52c41a";
      btnEl.style.color = "#52c41a";
      feedback.style.display = "block";
      feedback.style.background = "#f6ffed";
      feedback.style.color = "#52c41a";
      feedback.innerHTML = "<strong>✅ 正确！</strong><br>" + (mode === "en_to_cn" ? capitalize(correctWord.word) + " = " + correctWord.chinese : correctWord.chinese + " = " + capitalize(correctWord.word));
      speakChinese("正确");
      // 保存进度：最后一题且全对时标记 mastered
      const isLast = currentQuizIndex + 1 >= quizOrder.length;
      const allCorrect = isLast && window.quizResults.every(function(r) { return r.correct; });
      apiPOST("/api/progress/" + USER_ID + "/" + correctWord.id + "?status=" + (allCorrect ? "mastered" : "learned"), {});
    } else {
      btnEl.style.background = "#fff2f0";
      btnEl.style.borderColor = "#ff4d4f";
      btnEl.style.color = "#ff4d4f";
      // 高亮正确答案
      const correctText = mode === "en_to_cn" ? correctWord.chinese : correctWord.word;
      document.querySelectorAll("#quiz-options button").forEach(function(b) {
        const span = b.querySelector("span:last-child");
        if (span && span.textContent.trim() === correctText) {
          b.style.background = "#f6ffed";
          b.style.borderColor = "#52c41a";
          b.style.color = "#52c41a";
        }
      });
      feedback.style.display = "block";
      feedback.style.background = "#fff2f0";
      feedback.style.color = "#ff4d4f";
      feedback.innerHTML = "<strong>❌ 不对哦~</strong><br>正确答案：<strong>" + correctText + "</strong>";
      speakChinese("不对");
    }

    nextBtn.style.display = "block";
    nextBtn.textContent = currentQuizIndex + 1 >= quizOrder.length ? "查看成绩 🎉" : "下一题 →";
  }

  function nextQuizQuestion() {
    currentQuizIndex++;
    loadQuizQuestion();
  }

  function resetQuizResults() {
    window.quizResults = [];
  }

  function showQuizSummary() {
    const results = window.quizResults || [];
    const total = results.length;
    const correct = results.filter(r => r.correct).length;
    const pct = total > 0 ? Math.round(correct / total * 100) : 0;
    const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '👏' : pct >= 50 ? '💪' : '📚';
    const msgs = pct >= 90 ? '太厉害了，全都会！' : pct >= 70 ? '很棒，继续加油！' : pct >= 50 ? '还不错，再接再厉！' : '多练练，一定会进步！';
    
    const container = document.getElementById("quiz-options");
    container.innerHTML = '<div style="text-align:center;padding:40px 20px">' +
      '<div style="font-size:72px;margin-bottom:16px">' + emoji + '</div>' +
      '<div style="font-size:40px;font-weight:800;color:#6c63ff;margin-bottom:8px">' + pct + '%</div>' +
      '<div style="font-size:15px;color:#999;margin-bottom:24px">' + correct + '/' + total + ' 题正确</div>' +
      '<div style="font-size:16px;color:#555;margin-bottom:32px">' + msgs + '</div>' +
      '<div style="background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:24px">' +
        '<div style="display:flex;gap:16px">' +
          '<div style="flex:1;text-align:center"><div style="font-size:28px;font-weight:700;color:#52c41a">' + correct + '</div><div style="font-size:12px;color:#999">正确</div></div>' +
          '<div style="width:1px;background:#eee"></div>' +
          '<div style="flex:1;text-align:center"><div style="font-size:28px;font-weight:700;color:#ff4d4f">' + (total - correct) + '</div><div style="font-size:12px;color:#999">错误/跳过</div></div>' +
          '<div style="width:1px;background:#eee"></div>' +
          '<div style="flex:1;text-align:center"><div style="font-size:28px;font-weight:700;color:#6c63ff">' + total + '</div><div style="font-size:12px;color:#999">总题数</div></div>' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="startQuiz()">🔄 再来一轮</button>' +
      `<button class="btn btn-secondary" style="width:100%;margin-bottom:8px;background:#f5f7ff;border:1px solid #e0e6ff;color:#6c63ff;display:flex;align-items:center;justify-content:center;gap:6px" onclick="switchView('learn')">← 返回单词表</button>` +
      `<button class="btn btn-secondary" style="width:100%;background:#f0f4ff;border:1px solid #d0d8ff;color:#6c63ff;display:flex;align-items:center;justify-content:center;gap:6px" onclick="backToHome()">🏠 返回首页</button>` +
    '</div>';
    document.getElementById("quiz-feedback").style.display = "none";
    document.getElementById("quiz-next-btn").style.display = "none";
    // 隐藏跳过按钮
    const skipBtn = document.querySelector('#view-quiz .btn-secondary[onclick="skipQuiz()"]');
    if (skipBtn) skipBtn.parentElement.style.display = "none";
    // 隐藏题号提示
    document.getElementById("quiz-hint").style.display = "none";
    speakChinese(msgs);
  }

  function speakQuizWord() {
    // 获取当前测验题目对应的单词并朗读
    const wordId = quizOrder[currentQuizIndex];
    const w = currentWords.find(x => x.id === wordId);
    if (!w) return;
    if (currentQuizMode === "en_to_cn") {
      speakWord(w.word);
    } else {
      // 中文题：朗读中文
      speakChinese(w.chinese);
    }
  }







  function skipQuiz() {
    // 跳过也算一题，但不算正确
    if (!window.quizResults) window.quizResults = [];
    window.quizResults.push({ correct: false, skipped: true });
    currentQuizIndex++;
    loadQuizQuestion();
  }

  function showAnswer() {
    const wordId = quizOrder[currentQuizIndex];
    const w = currentWords.find(x => x.id === wordId);
    if (!w) return;
    let correct;
    if (currentQuizMode === "en_to_cn") correct = w.chinese;
    else correct = w.word;
    toast("答案：" + correct);
  }

  // ========== 选择题学习 ==========
  let cl_words = [];
  let cl_idx = 0;
  let cl_order = [];
  let cl_correct = 0;
  let cl_total = 0;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startChoiceLearn() {
    if (!currentModule || currentWords.length === 0) {
      toast('请先选择一个模块');
      switchView('home');
      return;
    }
    cl_words = [...currentWords];
    cl_idx = 0;
    cl_correct = 0;
    cl_total = 0;
    const ids = cl_words.map(w => w.id);
    cl_order = shuffle(ids);
    document.getElementById('word-list').style.display = 'none';
    document.getElementById('word-detail-area').style.display = 'none';
    document.getElementById('quiz-toggle-bar').style.display = 'none';
    const area = document.getElementById('choice-learn-area');
    area.style.display = 'block';
    switchView('learn');
    document.getElementById('topbar-title').textContent = '🎯 开始学习';
    loadChoiceQuestion();
  }

  function loadChoiceQuestion() {
    if (cl_idx >= cl_order.length) {
      showChoiceSummary();
      return;
    }
    const wordId = cl_order[cl_idx];
    const word = cl_words.find(w => w.id === wordId);
    if (!word) { cl_idx++; loadChoiceQuestion(); return; }
    const mode = Math.random() > 0.5 ? 'en2cn' : 'cn2en';
    const others = cl_words.filter(w => w.id !== wordId);
    const distractors = shuffle(others).slice(0, 3);
    let options;
    if (mode === 'en2cn') {
      options = shuffle([
        { text: word.chinese, correct: true },
        ...distractors.map(d => ({ text: d.chinese, correct: false }))
      ]);
    } else {
      options = shuffle([
        { text: word.word, correct: true },
        ...distractors.map(d => ({ text: d.word, correct: false }))
      ]);
    }
    const prompt = mode === 'en2cn' ? '这个单词的中文是？' : '这个中文的英文是？';
    const question = mode === 'en2cn' ? capitalize(word.word) : word.chinese;
    const pct = Math.round((cl_idx / cl_order.length) * 100);
    if (mode === 'en2cn') setTimeout(function() { speakWord(word.word); }, 100);

    const esc = function(s) { return (s || '').replace(/'/g, "\'"); };

    const area = document.getElementById('choice-learn-area');
    area.innerHTML = '<button class="btn btn-secondary" onclick="showWordList()" style="margin-bottom:12px;display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:14px;border-radius:10px;background:#f5f7ff;border:1px solid #e0e6ff;color:#6c63ff;font-weight:500"><span style="font-size:16px">←</span> 返回单词表</button>' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
      '<span style="font-size:13px;color:#999">' + currentModule + '</span>' +
      '<div style="flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden">' +
        '<div style="height:100%;background:linear-gradient(90deg,#4f9fff,#6c63ff);width:' + pct + '%;border-radius:3px;transition:width .3s"></div>' +
      '</div>' +
      '<span style="font-size:12px;color:#999">' + (cl_idx + 1) + '/' + cl_order.length + '</span>' +
    '</div>' +
    '<div style="text-align:center;margin-bottom:8px">' +
      '<div style="font-size:40px;font-weight:800;color:#333;margin-bottom:4px">' + question + '</div>' +
      '<button class="speak-btn" onclick="speakChoiceWord(\'' + esc(mode) + '\',' + wordId + ')" style="margin:0 auto">🔊 听发音</button>' +
      '<div style="font-size:14px;color:#999;margin-top:4px">' + prompt + '</div>' +
    '</div>' +
    '<div id="choice-options" style="display:flex;flex-direction:column;gap:10px;margin-top:16px"></div>' +
    '<div id="choice-feedback" style="display:none;margin-top:12px;text-align:center;padding:14px;border-radius:12px;font-size:15px;line-height:1.5"></div>' +
    '<div style="display:flex;gap:10px;margin-top:12px">' +
      '<button id="cl-next-btn" class="btn btn-primary" style="flex:1;display:none" onclick="clNextQuestion()">下一题 →</button>' +
      '<button class="btn btn-secondary" style="padding:12px 20px;background:#f5f5f5;border:1px solid #ddd;color:#999" onclick="clSkipQuestion()">跳过</button>' +
    '</div>';

    const optsContainer = document.getElementById('choice-options');
    const labels = ['A', 'B', 'C', 'D'];
    options.forEach(function(opt, i) {
      const btn = document.createElement('button');
      btn.className = 'choice-opt-btn';
      btn.style.cssText = 'width:100%;text-align:left;padding:14px 18px;font-size:16px;border-radius:12px;background:white;border:2px solid #e8eeff;color:#333;cursor:pointer;transition:all .15s';
      btn.innerHTML = '<span style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#f0f4ff;color:#6c63ff;font-size:13px;text-align:center;line-height:28px;font-weight:700;margin-right:10px;flex-shrink:0">' + labels[i] + '</span><span>' + opt.text + '</span>';
      btn.onclick = (function(o) {
        return function() { handleChoiceAnswer(o, word, mode); };
      })(opt);
      optsContainer.appendChild(btn);
    });
  }

  function speakChoiceWord(mode, wordId) {
    const w = cl_words.find(function(x) { return x.id === wordId; });
    if (!w) return;
    if (mode === 'en2cn') speakWord(w.word);
    else speakChinese(w.chinese);
  }

  function handleChoiceAnswer(opt, word, mode) {
    document.querySelectorAll('.choice-opt-btn').forEach(function(b) { b.style.pointerEvents = 'none'; });
    cl_total++;
    const feedback = document.getElementById('choice-feedback');
    const nextBtn = document.getElementById('cl-next-btn');
    const isCorrect = opt.correct;

    if (isCorrect) {
      cl_correct++;
      clStyle(feedback, '#f6ffed', '#52c41a', '<strong>✅ 正确！</strong><br>' + (mode === 'en2cn' ? capitalize(word.word) + ' = ' + word.chinese : word.chinese + ' = ' + capitalize(word.word)));
      clStyleBtn(event.target, '#f6ffed', '#52c41a');
      speakChinese('正确');
      // 全对时标记 mastered，否则 learned
      const isLast = (cl_idx + 1) >= cl_order.length;
      const isPerfect = isLast && (cl_correct === cl_total);
      saveChoiceProgress(word.id, isPerfect ? 'mastered' : 'learned');
    } else {
      clStyle(feedback, '#fff2f0', '#ff4d4f', '<strong>❌ 不对哦~</strong><br>正确答案：<strong>' + (mode === 'en2cn' ? word.chinese : capitalize(word.word)) + '</strong>');
      // 高亮正确答案
      document.querySelectorAll('.choice-opt-btn span:last-child').forEach(function(span) {
        const txt = span.textContent.trim();
        const correctTxt = mode === 'en2cn' ? word.chinese : word.word;
        if (txt === correctTxt) {
          span.parentElement.style.background = '#f6ffed';
          span.parentElement.style.borderColor = '#52c41a';
          span.parentElement.style.color = '#52c41a';
        }
      });
      // 标红选错的
      event.target.style.background = '#fff2f0';
      event.target.style.borderColor = '#ff4d4f';
      event.target.style.color = '#ff4d4f';
      speakChinese('不对');
    }

    nextBtn.style.display = 'block';
    nextBtn.textContent = (cl_idx + 1) >= cl_order.length ? '查看成绩 🎉' : '下一题 →';
  }

  function clSkipQuestion() {
    cl_total++; // 跳过也算一题，但不算正确
    cl_idx++;
    loadChoiceQuestion();
  }

  function clStyle(el, bg, color, html) {
    el.style.display = 'block';
    el.style.background = bg;
    el.style.color = color;
    el.innerHTML = html;
  }

  function clStyleBtn(btn, bg, color) {
    btn.style.background = bg;
    btn.style.borderColor = color;
    btn.style.color = color;
  }

  async function saveChoiceProgress(wordId, status) {
    status = status || 'learned';
    try {
      await apiPOST('/api/progress/' + USER_ID + '/' + wordId + '?status=' + status, {});
    } catch(e) {}
  }

  function clNextQuestion() {
    cl_idx++;
    loadChoiceQuestion();
  }

  function showChoiceSummary() {
    const pct = cl_total > 0 ? Math.round(cl_correct / cl_total * 100) : 0;
    const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '👏' : pct >= 50 ? '💪' : '📚';
    const msgs = pct >= 90 ? '太厉害了，全都会！' : pct >= 70 ? '很棒，继续加油！' : pct >= 50 ? '还不错，再接再厉！' : '多练练，一定会进步！';
    const area = document.getElementById('choice-learn-area');
    area.innerHTML = '<div style="text-align:center;padding:40px 20px">' +
      '<div style="font-size:72px;margin-bottom:16px">' + emoji + '</div>' +
      '<div style="font-size:40px;font-weight:800;color:#6c63ff;margin-bottom:8px">' + pct + '%</div>' +
      '<div style="font-size:15px;color:#999;margin-bottom:24px">' + cl_correct + '/' + cl_total + ' 题正确</div>' +
      '<div style="font-size:16px;color:#555;margin-bottom:32px">' + msgs + '</div>' +
      '<div style="background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:24px">' +
        '<div style="display:flex;gap:16px">' +
          '<div style="flex:1;text-align:center"><div style="font-size:28px;font-weight:700;color:#52c41a">' + cl_correct + '</div><div style="font-size:12px;color:#999">正确</div></div>' +
          '<div style="width:1px;background:#eee"></div>' +
          '<div style="flex:1;text-align:center"><div style="font-size:28px;font-weight:700;color:#ff4d4f">' + (cl_total - cl_correct) + '</div><div style="font-size:12px;color:#999">错误</div></div>' +
          '<div style="width:1px;background:#eee"></div>' +
          '<div style="flex:1;text-align:center"><div style="font-size:28px;font-weight:700;color:#6c63ff">' + cl_total + '</div><div style="font-size:12px;color:#999">总题数</div></div>' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="startChoiceLearn()">🔄 再来一轮</button>' +
      '<button class="btn btn-secondary" style="width:100%;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;background:#f5f7ff;border:1px solid #e0e6ff;color:#6c63ff;font-weight:500" onclick="showWordList()">← 返回单词表</button>' +
      '<button class="btn btn-secondary" style="width:100%;background:#f0f4ff;border:1px solid #d0d8ff;color:#6c63ff;display:flex;align-items:center;justify-content:center;gap:6px" onclick="backToHome()">🏠 返回首页</button>' +
    '</div>';
    speakChinese(msgs);
  }

  function showLessonList() {
    switchView('home');
  // 直接跳转到课文模块列表
    showTextbookList();
  }

  function backToHome() {
    switchView('home');
    loadModules();
  }


// ========== 学习报告 ==========
  async function loadReport() {
    try {
      const data = await apiGET(`/api/progress/${USER_ID}`);
      const total = data._total;
      const pct = total.percent || 0;
      document.getElementById("total-percent").textContent = pct + "%";
      document.getElementById("total-percent").parentElement.style.setProperty("--pct", pct + "%");
      document.getElementById("stat-total").textContent = total.total;
      document.getElementById("stat-learned").textContent = total.learned;
      document.getElementById("stat-mastered").textContent = total.mastered;
      // 各模块
      const container = document.getElementById("report-modules");
      container.innerHTML = "";
      const keys = Object.keys(data).filter(k => k !== "_total");
      for (const mod of keys) {
        const p = data[mod];
        const total = p.total || 0;
        const learned = p.learned || 0;
        const mastered = p.mastered || 0;
        const pctM = total > 0 ? Math.round(learned / total * 100) : 0;

        // 状态标签
        let statusLabel = '<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#f5f5f5;color:#999">未开始</span>';
        if (learned > 0 && mastered === 0) statusLabel = '<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#e6f7ff;color:#1890ff">学习中</span>';
        if (mastered > 0) statusLabel = '<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#f6ffed;color:#52c41a">已掌握</span>';
        if (learned === total && total > 0 && mastered < total) statusLabel = '<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#fff7e6;color:#fa8c16">待巩固</span>';

        // 进度条颜色
        let barColor = '#e8eeff';
        if (pctM >= 100) barColor = '#52c41a';
        else if (pctM >= 60) barColor = '#4f9fff';

        const pctBig = pctM >= 100
          ? '<span style="color:#52c41a;font-weight:700">&#10004; ' + pctM + '%</span>'
          : '<span style="color:#6c63ff;font-weight:700">' + pctM + '%</span>';

        const div = document.createElement("div");
        div.className = "report-card";
        div.onclick = (function(m) { return function() {
          openModule(m);
        }; })(mod);
        // 纯静态展示，无点击事件
        div.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
          '<div style="font-weight:600;font-size:15px">' + mod + '</div>' +
          '<div style="display:flex;align-items:center;gap:8px">' +
            statusLabel +
            '<span style="font-size:14px">' + pctBig + '</span></div></div>' +
          '<div style="height:8px;background:#f0f4ff;border-radius:4px;overflow:hidden;margin-bottom:8px">' +
            '<div style="height:100%;background:' + barColor + ';width:' + pctM + '%;border-radius:4px;transition:width .4s"></div></div>' +
          '<div style="display:flex;gap:16px;font-size:12px;color:#666">' +
            '<span>&#128214; 已学 <b style="color:#333">' + learned + '</b></span>' +
            '<span>&#11088; 已掌握 <b style="color:#333">' + mastered + '</b></span>' +
            '<span>&#128218; 共 <b style="color:#333">' + total + '</b></span></div>';
        container.appendChild(div);
      }
    } catch (e) {
      toast("加载报告失败");
    }
  }

      <span class="nav-item-icon">🏠</span>年级

      <span class="nav-item-icon">📚</span>KET

      <span class="nav-item-icon">📊</span>报告
    </div>
  </div>
  `);

  
  // ========== KET 学习功能 ==========
  let ketCategories = [];

  async function loadKetCategories() {
    try {
      const data = await apiGET('/api/ket/categories');
      ketCategories = data.categories || [];

      const container = document.getElementById('ket-category-list');
      container.innerHTML = '';

      // 按类型分组
      const grouped = {};
      ketCategories.forEach(cat => {
        if (!grouped[cat.type]) grouped[cat.type] = [];
        grouped[cat.type].push(cat);
      });

      // 渲染分类卡片
      for (const [type, cats] of Object.entries(grouped)) {
        const typeDiv = document.createElement('div');
        typeDiv.style.gridColumn = '1 / -1';
        typeDiv.style.marginTop = '12px';
        typeDiv.style.marginBottom = '8px';
        typeDiv.style.fontSize = '16px';
        typeDiv.style.fontWeight = '600';
        typeDiv.style.color = '#333';
        typeDiv.textContent = type === '词汇' ? '📖 词汇学习' : type === '句型' ? '💬 句型练习' : '📝 语法知识';
        container.appendChild(typeDiv);

        cats.forEach(cat => {
          const card = document.createElement('div');
          card.className = 'module-card';
          card.innerHTML = `
            <div class="module-name">${cat.category}</div>
            <div class="module-count">${cat.count} 项</div>
          `;
          card.onclick = () => openKetCategory(cat.type, cat.category);
          container.appendChild(card);
        });
      }

      // 显示分类列表，隐藏内容区
      container.style.display = 'grid';
      document.getElementById('ket-content-area').style.display = 'none';

    } catch (e) {
      console.error('加载 KET 分类失败:', e);
      toast('加载失败，请检查后端服务');
    }
  }

  
  // ========== KET 分页功能 ==========
  let ketCurrentPage = 1;
  let ketItemsPerPage = 10; // 默认每页10项
  let ketCurrentItems = []; // 当前显示的数据
  let ketCurrentType = ''; // 当前类型
  let ketCurrentCategory = ''; // 当前分类

  function renderKetPagination(totalItems) {
    const totalPages = Math.ceil(totalItems / ketItemsPerPage);
    const container = document.getElementById('ket-pagination');
    
    if (!container) {
      // 创建分页容器
      const contentArea = document.getElementById('ket-content-area');
      const paginationDiv = document.createElement('div');
      paginationDiv.id = 'ket-pagination';
      paginationDiv.style.cssText = 'display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px;padding:16px;background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)';
      contentArea.appendChild(paginationDiv);
    }
    
    if (totalPages <= 1) {
      if (container) container.style.display = 'none';
      return;
    }
    
    const paginationContainer = document.getElementById('ket-pagination');
    paginationContainer.style.display = 'flex';
    
    let html = '';
    
    // 上一页按钮 - 仅在非第一页时显示
    if (ketCurrentPage > 1) {
      html += `<button class="btn btn-secondary" onclick="changeKetPage(${ketCurrentPage - 1})" style="padding:8px 16px;font-size:14px">← 上一页</button>`;
    }
    
    // 页码信息
    html += `<span style="font-size:14px;color:#666;padding:0 12px">第 ${ketCurrentPage} / ${totalPages} 页 (共 ${totalItems} 项)</span>`;
    
    // 每页数量选择
    html += `<select onchange="changeKetItemsPerPage(this.value)" style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-left:8px">`;
    html += `<option value="5" ${ketItemsPerPage === 5 ? 'selected' : ''}>每页5项</option>`;
    html += `<option value="10" ${ketItemsPerPage === 10 ? 'selected' : ''}>每页10项</option>`;
    html += `<option value="20" ${ketItemsPerPage === 20 ? 'selected' : ''}>每页20项</option>`;
    html += `</select>`;
    
    // 下一页按钮 - 仅在非最后一页时显示
    if (ketCurrentPage < totalPages) {
      html += `<button class="btn btn-secondary" onclick="changeKetPage(${ketCurrentPage + 1})" style="padding:8px 16px;font-size:14px;margin-left:8px">下一页 →</button>`;
    }
    
    paginationContainer.innerHTML = html;
  }

  function changeKetPage(page) {
    const totalPages = Math.ceil(ketCurrentItems.length / ketItemsPerPage);
    if (page < 1 || page > totalPages) return;
    
    ketCurrentPage = page;
    renderKetCurrentPage();
    renderKetPagination(ketCurrentItems.length);
    
    // 滚动到内容顶部
    document.getElementById('ket-content-title').scrollIntoView({ behavior: 'smooth' });
  }

  function changeKetItemsPerPage(count) {
    ketItemsPerPage = parseInt(count);
    ketCurrentPage = 1;
    renderKetCurrentPage();
    renderKetPagination(ketCurrentItems.length);
  }

  function renderKetCurrentPage() {
    const container = document.getElementById('ket-content-list');
    const start = (ketCurrentPage - 1) * ketItemsPerPage;
    const end = start + ketItemsPerPage;
    const pageItems = ketCurrentItems.slice(start, end);
    
    if (ketCurrentType === '词汇') {
      container.innerHTML = pageItems.map((w, i) => `
        <div class="word-detail-card" style="margin-bottom:12px;padding:16px;background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
          <div style="font-size:20px;font-weight:600;color:#4f9fff;margin-bottom:8px;display:flex;align-items:center;gap:12px">
            <span style="background:#f0f4ff;color:#4f9fff;padding:4px 12px;border-radius:20px;font-size:14px">${start + i + 1}</span>
            ${w.word}
            <button class="speak-btn" onclick="speakWord('${w.word}')" style="margin-left:8px;padding:4px 12px;font-size:12px">🔊</button>
          </div>
          <div style="font-size:14px;color:#666;margin-bottom:4px">${w.chinese}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
            <span style="font-size:13px;color:#999;font-style:italic;flex:1">例：${w.example}</span>
            <button class="speak-btn" onclick="speakWord('${w.example}')" style="padding:2px 8px;font-size:11px">🔊</button>
          </div>
        </div>
      `).join('');
    } else if (ketCurrentType === '句型') {
      container.innerHTML = pageItems.map((s, i) => `
        <div class="word-detail-card" style="margin-bottom:12px;padding:16px;background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
          <div style="font-size:18px;font-weight:600;color:#4f9fff;margin-bottom:8px;display:flex;align-items:center;gap:12px">
            <span style="background:#f0f4ff;color:#4f9fff;padding:4px 12px;border-radius:20px;font-size:14px">${start + i + 1}</span>
            ${s.english}
            <button class="speak-btn" onclick="speakWord('${s.english}')" style="margin-left:8px;padding:4px 12px;font-size:12px">🔊</button>
          </div>
          <div style="font-size:14px;color:#666;margin-bottom:4px">${s.chinese}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
            <span style="font-size:12px;color:#999;background:#f0f4ff;padding:4px 8px;border-radius:4px;display:inline-block">用途：${s.usage}</span>
            <button class="speak-btn" onclick="speakWord('${s.english}')" style="padding:2px 8px;font-size:11px">🔊 朗读</button>
          </div>
        </div>
      `).join('');
    }
  }

  async function openKetCategory(type, category) {
    try {
      const container = document.getElementById('ket-content-list');
      const titleEl = document.getElementById('ket-content-title');
      
      // 重置分页状态
      ketCurrentPage = 1;
      ketCurrentType = type;
      ketCurrentCategory = category;
      
      // 隐藏分类列表，显示内容区
      document.getElementById('ket-category-list').style.display = 'none';
      document.getElementById('ket-content-area').style.display = 'block';
      
      // 移除旧的分页容器（如果存在）
      const oldPagination = document.getElementById('ket-pagination');
      if (oldPagination) oldPagination.remove();

      if (type === '词汇') {
        titleEl.textContent = '📖 ' + category;
        const data = await apiGET('/api/ket/words?category=' + encodeURIComponent(category));
        ketCurrentItems = data.words || [];
        
        renderKetCurrentPage();
        renderKetPagination(ketCurrentItems.length);

      } else if (type === '句型') {
        titleEl.textContent = '💬 ' + category;
        const data = await apiGET('/api/ket/sentences?category=' + encodeURIComponent(category));
        ketCurrentItems = data.sentences || [];
        
        renderKetCurrentPage();
        renderKetPagination(ketCurrentItems.length);

      } else if (type === '语法') {
        titleEl.textContent = '📝 ' + category;
        const data = await apiGET('/api/ket/grammar?category=' + encodeURIComponent(category));
        const grammar = data.grammar || {};

        let html = `
          <div class="word-detail-card" style="margin-bottom:12px;padding:16px;background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
            <div style="font-size:16px;font-weight:600;color:#d48806;margin-bottom:8px">📖 规则</div>
            <div style="font-size:14px;color:#666;line-height:1.6">${grammar.规则 || ''}</div>
          </div>
        `;

        if (grammar.例句 && grammar.例句.length > 0) {
          html += `
            <div class="word-detail-card" style="margin-bottom:12px;padding:16px;background:#fffbf0;border-radius:12px;border:2px solid #ffe7ba">
              <div style="font-size:16px;font-weight:600;color:#d48806;margin-bottom:12px">📝 例句 (${grammar.例句.length}个)</div>
              ${grammar.例句.map((ex, idx) => `
                <div style="padding:8px 0;border-bottom:1px dashed #ffe7ba;display:flex;align-items:center;gap:8px">
                  <span style="background:#ffe7ba;color:#d48806;padding:2px 8px;border-radius:10px;font-size:12px">${idx + 1}</span>
                  <span style="font-size:15px;color:#333">${ex}</span>
                  <button class="speak-btn" onclick="speakWord('${ex}')" style="margin-left:auto;padding:2px 8px;font-size:11px">🔊</button>
                </div>
              `).join('')}
            </div>
          `;
        }

        container.innerHTML = html;
      }

    } catch (e) {
      console.error('加载 KET 内容失败:', e);
      toast('加载失败');
    }
  }

  function backToKetCategories() {
    document.getElementById('ket-category-list').style.display = 'grid';
    document.getElementById('ket-content-area').style.display = 'none';
  }

  // ========== 启动 ==========
  // 默认显示年级选择页
  document.getElementById('topbar-right').style.display = 'none';
  loadGrades();
</script>
