<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网络诊断</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
    .ok { color: #0f0; }
    .err { color: #f00; }
    pre { background: #000; padding: 10px; border: 1px solid #333; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🔍 Pad 网络诊断</h1>
  <div id="result">检测中...</div>
  <script>
    const result = document.getElementById('result');
    const log = (msg, ok) => {
      const div = document.createElement('div');
      div.className = ok ? 'ok' : 'err';
      div.innerHTML = (ok ? '✅ ' : '❌ ') + msg;
      result.appendChild(div);
    };
    async function test() {
      // 1. 测试 Cloudflare
      try {
        const r = await fetch('https://english-learning-app-6hl.pages.dev/docs/', {mode: 'cors'});
        log(`Cloudflare /docs/ HTTP ${r.status} (${r.headers.get('content-length')} bytes)`, r.ok);
      } catch(e) { log('Cloudflare: ' + e.message, false); }
      // 2. 测试 GitHub Pages
      try {
        const r = await fetch('https://meedy2023.github.io/english-learning-app/', {mode: 'cors'});
        log(`GitHub Pages / HTTP ${r.status}`, r.ok);
      } catch(e) { log('GitHub Pages: ' + e.message, false); }
      // 3. 测试通用网络
      try {
        const r = await fetch('https://www.baidu.com', {mode: 'cors'});
        log(`baidu.com HTTP ${r.status}`, r.ok);
      } catch(e) { log('baidu: ' + e.message, false); }
      // 4. 用户代理
      log('User-Agent: ' + navigator.userAgent, true);
      log('在线状态: ' + (navigator.onLine ? '在线' : '离线'), navigator.onLine);
    }
    test();
  </script>
</body>
</html>
